; Firmware-only transition from 0.4.1-3-g1d8f5ec. Read README.md first.
[platformio]
default_envs = ota
data_dir = disabled-filesystem-uploads

[env]
platform = espressif32@4.4.0
board = nodemcu-32s
framework = arduino, espidf
platform_packages =
    framework-arduinoespressif32 @ https://github.com/marcovannoord/arduino-esp32.git#d011dd7ef5d26e7ba2c2c093f422c534bacf4661
board_build.partitions = partitions.csv
lib_deps =
    me-no-dev/AsyncTCP@1.1.1
    https://github.com/me-no-dev/ESPAsyncWebServer.git#1dde9cf0219de662ed0882c0b6208057f70f105d
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:tools/firmware_only.py
build_flags =
    -DMQTT_MAX_PACKET_SIZE=512
    -DCORE_DEBUG_LEVEL=0
    -DLOG_BOOTLOADER_LEVEL=LOG_BOOTLOADER_LEVEL_NONE
    -DESP32
    -DBUILTIN_LED=2
    -DLED_BUILTIN=2
    -DASYNCWEBSERVER_REGEX
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
monitor_speed = 921600

[env:ota]
upload_protocol = espota

