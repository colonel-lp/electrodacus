name: ESP-IDF CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # full history so version handling via `git describe` works
          fetch-depth: 0

      - name: Build firmware (ESP-IDF)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.1
          target: esp32
          command: |
            idf.py build
            # Build the SPIFFS filesystem image from the data/ directory.
            # Size must match the "spiffs" partition in partitions.csv (0x170000).
            python "$IDF_PATH/components/spiffs/spiffsgen.py" \
              $((0x170000)) data build/spiffs.bin

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error
